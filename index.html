<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="SGT by AGES — Accessible Ghost Exploration Solutions. Generate haunted tours, investigate with paranormal tools, and log your evidence." />
    <meta name="theme-color" content="#0a0f1e" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script>
      try {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          document.documentElement.classList.toggle('dark', e.matches);
        });
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SGT by AGES" />
    <meta property="og:title" content="SGT by AGES" />
    <meta property="og:description" content="Accessible Ghost Exploration Solutions — haunted tours, paranormal tools, and an evidence journal." />
    <meta property="og:type" content="website" />
    <title>SGT by AGES — Accessible Ghost Exploration Solutions</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
