workflows:
  android-capacitor-build:
    name: AGES Android Capacitor build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - ages-explorer-upload
      node: 20
      java: 21
      vars:
        VITE_BASE44_APP_ID: 6a2dfe40e73c2bacfe73eeb1
        VITE_BASE44_APP_BASE_URL: https://accessible-ghost-exploration-solutions.base44.app
        VITE_REVENUECAT_ANDROID_API_KEY: goog_wPxuKKuyTFFPrtRleXpHYHfvlkI
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build the existing Vite app
        script: npm run build
      - name: Sync the existing web app into Capacitor Android
        script: npx cap sync android
      - name: Verify Android Version 30 and native plugin wiring before Gradle
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          npm run verify:android-native-plugins
      - name: Set the Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Verify Android release signing credentials
        script: |
          set -eu
          test -n "${CM_KEYSTORE_PATH:-}" || { echo "CM_KEYSTORE_PATH is missing. Check the ages-explorer-upload Codemagic keystore reference."; exit 1; }
          test -f "$CM_KEYSTORE_PATH" || { echo "Android keystore was not found at $CM_KEYSTORE_PATH."; exit 1; }
          test -n "${CM_KEYSTORE_PASSWORD:-}" || { echo "CM_KEYSTORE_PASSWORD is missing."; exit 1; }
          test -n "${CM_KEY_ALIAS:-}" || { echo "CM_KEY_ALIAS is missing."; exit 1; }
          test -n "${CM_KEY_PASSWORD:-}" || { echo "CM_KEY_PASSWORD is missing."; exit 1; }
      - name: Build Android release artifacts
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew assembleRelease bundleRelease
      - name: Verify the Android App Bundle signature
        script: |
          set -eu
          AAB="$CM_BUILD_DIR/android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB" || { echo "Expected Android App Bundle was not produced at $AAB."; exit 1; }
          verification="$(jarsigner -verify -verbose -certs "$AAB" 2>&1)"
          printf '%s\n' "$verification"
          printf '%s\n' "$verification" | grep -q 'jar verified.' || {
            echo "The Android App Bundle is not signed. Failing the workflow."
            exit 1
          }
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab

  ios-capacitor-build:
    name: AGES iOS Capacitor build
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AGES Explorer Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ages.explorer
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        - AGES Explorer Production
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        VITE_BASE44_APP_ID: 6a2dfe40e73c2bacfe73eeb1
        VITE_BASE44_APP_BASE_URL: https://accessible-ghost-exploration-solutions.base44.app
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build the existing Vite app
        script: npm run build
      - name: Sync the existing web app into Capacitor iOS
        script: npx cap sync ios
      - name: Install iOS CocoaPods dependencies
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          pod install
      - name: Set up code signing settings on the Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project use-profiles
      - name: Verify the native iOS modules are linked
        script: |
          # All three native modules must be compiled into the App target, or their tools
          # fail silently on the device with no error: the Environment Monitor needs
          # AgesSensorsPlugin (magnetometer + barometer), the LiDAR depth scan needs
          # AgesDepthPlugin, and Save to Device needs AgesSaveToDevicePlugin.
          # Build 24 shipped without the sensors module linked, so
          # this step fails the build instead of uploading one that behaves the same.
          set -eu
          cd "$CM_BUILD_DIR/ios/App"
          for MODULE in AgesSensorsPlugin AgesDepthPlugin AgesSaveToDevicePlugin; do
            COUNT="$(grep -c "$MODULE.swift in Sources" App.xcodeproj/project.pbxproj || true)"
            echo "$MODULE.swift in Sources entries: $COUNT"
            test "$COUNT" -ge 1 || {
              echo "$MODULE.swift is not linked into the App target. The build would ship without that tool's native support."
              exit 1
            }
          done
      - name: Verify the iOS native plugin bridge registration
        script: |
          # Additive wiring/contract check (verify-ios-native-plugins.mjs): the
          # storyboard -> AgesBridgeViewController -> capacitorDidLoad registration
          # path, the JS/native plugin names, methods and events, and the version
          # guards. This does not replace the Compile Sources guard above and does
          # not touch any build setting.
          cd "$CM_BUILD_DIR"
          npm run verify:native-plugins
      - name: Set the iOS build number
        script: |
          # CFBundleVersion comes from CURRENT_PROJECT_VERSION in the checked-out
          # project.pbxproj. The rejected IPA archived a checkout that still had 14;
          # This source-preparation release requires Build 35.
          # Hard-stamp 35 deterministically (no App Store Connect lookup) so the
          # archived IPA always embeds CFBundleVersion 35 regardless of what the
          # checked-out project file contains. `agvtool new-version` only writes
          # CURRENT_PROJECT_VERSION, so marketing version 1.0 is untouched.
          # For the next release, bump this value by one.
          set -eu
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all 35
          STAMPED="$(grep -c 'CURRENT_PROJECT_VERSION = 35;' App.xcodeproj/project.pbxproj || true)"
          echo "CURRENT_PROJECT_VERSION = 35 occurrences in project.pbxproj: $STAMPED"
          test "$STAMPED" -ge 2 || {
            echo "CFBundleVersion 35 was not stamped into the Xcode project. Failing instead of uploading a stale build number."
            exit 1
          }
      - name: Build the signed App Store IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"
      - name: Verify the exported IPA embeds Build 35
        script: |
          # Additive pre-Publishing gate on the artifact itself, not the project
          # file: unzip the IPA xcode-project build-ipa just produced and read
          # the app Info.plist with PlistBuddy (both /usr/bin/unzip and
          # /usr/libexec/PlistBuddy ship with macOS on the build machine). The
          # archived values must be exactly bundle id com.ages.explorer,
          # marketing version 1.0, build number 35, or App Store Connect would
          # reject the upload again — so fail here, before Publishing runs.
          set -eu
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          IPA="$(ls "$IPA_DIR"/*.ipa 2>/dev/null | head -n 1 || true)"
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "No .ipa found in $IPA_DIR — the build-ipa step produced no artifact. Failing before Publishing."
            exit 1
          fi
          echo "Inspecting built IPA: $IPA"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          /usr/bin/unzip -o -q "$IPA" 'Payload/*.app/Info.plist' -d "$TMP_DIR" || true
          APP_PLIST="$(ls "$TMP_DIR"/Payload/*.app/Info.plist 2>/dev/null | head -n 1 || true)"
          if [ -z "$APP_PLIST" ] || [ ! -f "$APP_PLIST" ]; then
            echo "The IPA at $IPA contains no Payload/<App>.app/Info.plist. Failing before Publishing."
            exit 1
          fi
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PLIST" 2>/dev/null || true)"
          SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST" 2>/dev/null || true)"
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST" 2>/dev/null || true)"
          echo "Embedded CFBundleIdentifier: $BUNDLE_ID"
          echo "Embedded CFBundleShortVersionString: $SHORT_VERSION"
          echo "Embedded CFBundleVersion: $BUNDLE_VERSION"
          [ "$BUNDLE_ID" = "com.ages.explorer" ] || { echo "Expected CFBundleIdentifier com.ages.explorer but the IPA embeds '$BUNDLE_ID'. Failing before Publishing."; exit 1; }
          [ "$SHORT_VERSION" = "1.0" ] || { echo "Expected CFBundleShortVersionString 1.0 but the IPA embeds '$SHORT_VERSION'. Failing before Publishing."; exit 1; }
          [ "$BUNDLE_VERSION" = "35" ] || { echo "Expected CFBundleVersion 35 but the IPA embeds '$BUNDLE_VERSION'. Failing before Publishing."; exit 1; }
          echo "IPA metadata verified: com.ages.explorer 1.0 (35)."
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Disabled: automatic TestFlight beta review submission fails with HTTP 422
        # because export-compliance information has not been answered in App Store
        # Connect for the uploaded builds. The signed IPA is still uploaded to App
        # Store Connect; submit the build to TestFlight beta review manually after
        # answering the export compliance question there.
        submit_to_testflight: false

  ios-capacitor-adhoc-test:
    name: AGES iOS Ad Hoc device test artifact
    # Manual-only: no triggering block. Start only after explicit user approval.
    # Requires an uploaded matching distribution certificate and Ad Hoc profile
    # containing the designated registered iPhone and iPad. No assets are created.
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ages.explorer
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        - AGES Explorer Production
        - AGES Explorer Ad Hoc Test
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        VITE_BASE44_APP_ID: 6a2dfe40e73c2bacfe73eeb1
        VITE_BASE44_APP_BASE_URL: https://accessible-ghost-exploration-solutions.base44.app
    scripts:
      - name: Verify required Ad Hoc device identifiers
        script: |
          set +x
          set -eu
          # Never print environment values or the required device identifiers.
          node --input-type=module <<'NODE'
          const first = process.env.AGES_ADHOC_REQUIRED_UDID_1 || '';
          const second = process.env.AGES_ADHOC_REQUIRED_UDID_2 || '';
          const valid = value => (value.length === 40 || value.length === 25) &&
            !/[^0-9a-fA-F-]/.test(value) && /^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{8}-[0-9a-fA-F]{16})$/.test(value);
          if (!valid(first) || !valid(second) || first.toLowerCase() === second.toLowerCase()) {
            console.error('Both required UDID variables must contain distinct valid iPhone/iPad identifiers.');
            process.exit(1);
          }
          NODE
      - name: Install npm dependencies
        script: npm ci
      - name: Build the existing Vite app
        script: npm run build
      - name: Sync the existing web app into Capacitor iOS
        script: npx cap sync ios
      - name: Install iOS CocoaPods dependencies
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          pod install
      - name: Set up Ad Hoc code signing on the Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project use-profiles
      - name: Verify the native iOS modules are linked
        script: |
          set -eu
          cd "$CM_BUILD_DIR/ios/App"
          for MODULE in AgesSensorsPlugin AgesDepthPlugin AgesSaveToDevicePlugin; do
            COUNT="$(grep -c "$MODULE.swift in Sources" App.xcodeproj/project.pbxproj || true)"
            echo "$MODULE.swift in Sources entries: $COUNT"
            test "$COUNT" -ge 1 || {
              echo "$MODULE.swift is not linked into the App target. Failing the Ad Hoc build."
              exit 1
            }
          done
      - name: Verify the iOS native plugin bridge registration
        script: |
          cd "$CM_BUILD_DIR"
          npm run verify:native-plugins
      - name: Build the signed Ad Hoc IPA without changing the build number
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"
      - name: Verify Ad Hoc IPA metadata and embedded provisioning
        script: |
          set +x
          set -eu
          EXPECTED_UDID_1="${AGES_ADHOC_REQUIRED_UDID_1:-}"
          EXPECTED_UDID_2="${AGES_ADHOC_REQUIRED_UDID_2:-}"
          # Accept legacy 40-hex and current 8-hex/16-hex hyphenated UDIDs.
          # Length checks also reject multiline values; do not echo either ID.
          for REQUIRED_UDID in "$EXPECTED_UDID_1" "$EXPECTED_UDID_2"; do
            case "$REQUIRED_UDID" in
              *[!0123456789ABCDEFabcdef-]*) echo "A required UDID has an invalid format."; exit 1 ;;
            esac
            case "${#REQUIRED_UDID}" in
              40|25) ;;
              *) echo "A required UDID is missing or invalid."; exit 1 ;;
            esac
            printf '%s\n' "$REQUIRED_UDID" | /usr/bin/grep -E -x -q '([0-9A-Fa-f]{40}|[0-9A-Fa-f]{8}-[0-9A-Fa-f]{16})' || {
              echo "A required UDID has an invalid format."
              exit 1
            }
          done
          NORMALIZED_1="$(printf '%s' "$EXPECTED_UDID_1" | /usr/bin/tr '[:upper:]' '[:lower:]')"
          NORMALIZED_2="$(printf '%s' "$EXPECTED_UDID_2" | /usr/bin/tr '[:upper:]' '[:lower:]')"
          [ "$NORMALIZED_1" != "$NORMALIZED_2" ] || { echo "The two required UDIDs must be distinct."; exit 1; }
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          IPA="$(ls "$IPA_DIR"/*.ipa 2>/dev/null | head -n 1 || true)"
          test -n "$IPA" && test -f "$IPA" || { echo "No Ad Hoc IPA found in $IPA_DIR."; exit 1; }
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          /usr/bin/unzip -o -q "$IPA" -d "$TMP_DIR"
          APP_PLIST="$(ls "$TMP_DIR"/Payload/*.app/Info.plist 2>/dev/null | head -n 1 || true)"
          test -n "$APP_PLIST" && test -f "$APP_PLIST" || { echo "The IPA contains no app Info.plist."; exit 1; }
          APP_DIR="$(dirname "$APP_PLIST")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PLIST")"
          SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")"
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")"
          [ "$BUNDLE_ID" = "com.ages.explorer" ] || { echo "Unexpected IPA bundle identifier."; exit 1; }
          [ "$SHORT_VERSION" = "1.0" ] || { echo "Unexpected IPA marketing version."; exit 1; }
          [ "$BUNDLE_VERSION" = "35" ] || { echo "Expected the unchanged build number 35."; exit 1; }
          /usr/bin/codesign --verify --deep --strict "$APP_DIR"
          test -f "$APP_DIR/embedded.mobileprovision" || { echo "The IPA has no embedded provisioning profile."; exit 1; }
          PROFILE="$TMP_DIR/adhoc-profile.plist"
          /usr/bin/security cms -D -i "$APP_DIR/embedded.mobileprovision" > "$PROFILE"
          /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices:0' "$PROFILE" >/dev/null 2>&1 || {
            echo "The profile has no registered devices. An Ad Hoc profile is required."
            exit 1
          }
          ALL_DEVICES="$(/usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$PROFILE" 2>/dev/null || true)"
          DEBUG_ALLOWED="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE" 2>/dev/null || true)"
          [ "$ALL_DEVICES" != "true" ] || { echo "Enterprise provisioning is not permitted."; exit 1; }
          [ "$DEBUG_ALLOWED" = "false" ] || { echo "A distribution profile, not a development profile, is required."; exit 1; }
          RAW_DEVICES="$TMP_DIR/profile-devices.raw"
          DEVICE_LIST="$TMP_DIR/profile-devices.txt"
          /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$PROFILE" > "$RAW_DEVICES" 2>/dev/null || {
            echo "Could not read the profile's registered-device list."
            exit 1
          }
          /usr/bin/sed '1d;$d;s/^[[:space:]]*//;s/[[:space:]]*$//' "$RAW_DEVICES" > "$DEVICE_LIST"
          test -s "$DEVICE_LIST" || { echo "The profile has no registered devices."; exit 1; }
          for REQUIRED_UDID in "$EXPECTED_UDID_1" "$EXPECTED_UDID_2"; do
            /usr/bin/grep -F -x -q "$REQUIRED_UDID" "$DEVICE_LIST" || {
              echo "The embedded Ad Hoc profile is missing a required designated device."
              exit 1
            }
          done
          echo "Ad Hoc IPA verified: com.ages.explorer 1.0 (35); both required devices are present."
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log