workflows:
  android-capacitor-build:
    name: AGES Android Capacitor build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - ages-explorer-upload
      node: 20
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build the existing Vite app
        script: npm run build
      - name: Sync the existing web app into Capacitor Android
        script: npx cap sync android
      - name: Set the Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Verify Android release signing credentials
        script: |
          set -eu
          test -n "${CM_KEYSTORE_PATH:-}" || { echo "CM_KEYSTORE_PATH is missing. Check the ages-explorer-upload Codemagic keystore reference."; exit 1; }
          test -f "$CM_KEYSTORE_PATH" || { echo "Android keystore was not found at $CM_KEYSTORE_PATH."; exit 1; }
          test -n "${CM_KEYSTORE_PASSWORD:-}" || { echo "CM_KEYSTORE_PASSWORD is missing."; exit 1; }
          test -n "${CM_KEY_ALIAS:-}" || { echo "CM_KEY_ALIAS is missing."; exit 1; }
          test -n "${CM_KEY_PASSWORD:-}" || { echo "CM_KEY_PASSWORD is missing."; exit 1; }
      - name: Build Android release artifacts
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew assembleRelease bundleRelease
      - name: Verify the Android App Bundle signature
        script: |
          set -eu
          AAB="$CM_BUILD_DIR/android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB" || { echo "Expected Android App Bundle was not produced at $AAB."; exit 1; }
          verification="$(jarsigner -verify -verbose -certs "$AAB" 2>&1)"
          printf '%s\n' "$verification"
          printf '%s\n' "$verification" | grep -q 'jar verified.' || {
            echo "The Android App Bundle is not signed. Failing the workflow."
            exit 1
          }
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab

  ios-capacitor-build:
    name: AGES iOS Capacitor build
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AGES Explorer Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ages.explorer
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        - AGES Explorer Production
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        VITE_BASE44_APP_ID: 6a2dfe40e73c2bacfe73eeb1
        VITE_BASE44_APP_BASE_URL: https://accessible-ghost-exploration-solutions.base44.app
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build the existing Vite app
        script: npm run build
      - name: Sync the existing web app into Capacitor iOS
        script: npx cap sync ios
      - name: Install iOS CocoaPods dependencies
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          pod install
      - name: Set up code signing settings on the Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project use-profiles
      - name: Build the signed App Store IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true